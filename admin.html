<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: bold; margin-bottom: 8px; display: block; }
        .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; min-height: 150px; font-family: inherit; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .btn-cancel { background-color: #dc3545; display: none; margin-top: 10px;}
        .btn-cancel:hover { background-color: #c82333; }
        
        /* Estilos para la lista de cursos */
        .curso-list-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .curso-list-info h4 { margin-bottom: 5px; color: #333; }
        .curso-list-info p { font-size: 13px; color: #666; margin: 0; }
        .curso-actions button { padding: 6px 12px; margin-left: 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; color: white;}
        .btn-edit { background-color: #ffc107; color: #000 !important; }
        .btn-delete { background-color: #dc3545; }
    </style>
</head>
<body style="display: block; height: auto;">
    <nav class="navbar">
        <div class="nav-brand">Panel Superusuario</div>
        <div class="nav-links">
            <a href="dashboard.html" class="btn-back">Volver al Dashboard</a>
        </div>
    </nav>
    <main class="admin-container">
        
        <h2 id="form-titulo">Crear Nuevo Curso</h2>
        <p style="margin-bottom: 20px; color: #666;">Llena este formulario para publicar o modificar un curso en la plataforma.</p>
        
        <form id="form-curso">
            <div class="form-group">
                <label for="titulo">Título del Curso</label>
                <input type="text" id="titulo" required placeholder="Ej: Introducción a Python">
            </div>
            <div class="form-group">
                <label for="descripcion">Descripción Corta (Para la tarjeta)</label>
                <input type="text" id="descripcion" required placeholder="Ej: Aprende las bases de la programación...">
            </div>
            <div class="form-group">
                <label for="video">Enlace del Video (Opcional - Formato Embed de YouTube)</label>
                <input type="text" id="video" placeholder="Ej: https://www.youtube.com/embed/XXXXXXX">
            </div>
            <div class="form-group">
                <label for="texto">Contenido / Lectura de la clase (Opcional)</label>
                <textarea id="texto" placeholder="Puedes escribir el contenido aquí. Puedes usar etiquetas HTML como <br> para saltos de línea o <b> para negritas."></textarea>
            </div>
            <button type="submit" id="btn-submit" class="btn-success">Guardar y Publicar Curso</button>
            <button type="button" id="btn-cancelar" class="btn-cancel">Cancelar Edición</button>
        </form>
        <p id="mensaje-admin" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>

        <hr style="margin: 40px 0; border: 0; border-top: 2px solid #eee;">

        <h2>Cursos Publicados</h2>
        <div id="lista-cursos" style="margin-top: 20px;">
            <p>Cargando cursos...</p>
        </div>

    </main>
    <script type="module" src="admin.js"></script>
</body>
</html>
