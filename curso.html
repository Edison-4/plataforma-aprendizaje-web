<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Plataforma de Aprendizaje</title>
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="curso.css?v=7">
    
    <!-- EL TRUCO DEFINITIVO: CSS INCORPORADO PARA MÓVILES -->
    <style>
        @media screen and (max-width: 768px) {
            /* Obliga a la página a ser una sola columna vertical */
            body {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100vw !important;
                overflow-x: hidden !important;
            }
            
            /* Fuerza a la barra azul a ocupar el 100% de arriba */
            .navbar {
                width: 100% !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 15px !important;
                position: relative !important;
            }

            .nav-brand {
                margin-bottom: 15px !important;
                text-align: center !important;
            }
            
            /* Centra la caja blanca perfectamente abajo */
            .curso-container {
                width: 92% !important;
                max-width: 100% !important;
                margin: 25px auto !important;
                box-sizing: border-box !important;
                display: block !important;
            }

            .curso-header {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 15px !important;
            }

            .btn-completar {
                width: 100% !important;
            }

            .video-container iframe {
                width: 100% !important;
                height: auto !important;
                aspect-ratio: 16/9 !important;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand" id="marca-plataforma">Cargando...</div>
        <div class="nav-links">
            <a href="dashboard.html" class="btn-back">Volver al Dashboard</a>
        </div>
    </nav>
    <main class="curso-container">
        <div class="curso-header">
            <h1 id="curso-titulo">Cargando...</h1>
            <button id="btn-completar" class="btn-completar" style="display: none;">Marcar como completado</button>
        </div>
        <p id="curso-descripcion" class="descripcion-destacada"></p>
        <div id="curso-contenido" class="contenido-area">
            <div class="loader-container">
                <div class="spinner"></div>
                <p>Cargando material...</p>
            </div>
        </div>
    </main>
    
    <!-- Truco anti-caché en el JavaScript (Esta es la magia) -->
    <script type="module" src="curso.js?v=5"></script>
</body>
</html>
